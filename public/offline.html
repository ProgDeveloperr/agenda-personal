<!doctype html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#07111b"
    >

    <title>
        Sin conexión | Agenda Personal
    </title>

    <style>

        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            background:
                radial-gradient(
                    circle at top,
                    #102438,
                    #07111b 48%,
                    #040a10
                );

            color: #dbe6ed;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            width: min(
                100%,
                440px
            );

            padding: 28px;

            border:
                1px solid
                rgba(
                    151,
                    166,
                    184,
                    .12
                );

            border-radius: 18px;

            background:
                rgba(
                    8,
                    17,
                    27,
                    .92
                );

            box-shadow:
                0 28px 70px
                rgba(
                    0,
                    0,
                    0,
                    .34
                );
        }

        .mark {
            width: 52px;
            height: 52px;

            display: grid;
            place-items: center;

            margin-bottom: 22px;

            border:
                1px solid
                rgba(
                    90,
                    162,
                    255,
                    .18
                );

            border-radius: 15px;

            background:
                rgba(
                    90,
                    162,
                    255,
                    .05
                );
        }

        .mark svg {
            width: 27px;
            height: 27px;

            fill: none;

            stroke: #67a9ff;

            stroke-width: 1.7;

            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .eyebrow {
            color: #5a7489;

            font-size: 11px;
            font-weight: 800;

            letter-spacing: .08em;

            text-transform: uppercase;
        }

        h1 {
            margin:
                7px
                0
                10px;

            font-size: 31px;

            letter-spacing: -.045em;
        }

        p {
            margin: 0;

            color: #71889b;

            font-size: 14px;

            line-height: 1.6;
        }

        button {
            width: 100%;
            min-height: 44px;

            margin-top: 24px;

            border:
                1px solid
                rgba(
                    53,
                    220,
                    120,
                    .18
                );

            border-radius: 10px;

            background:
                rgba(
                    53,
                    220,
                    120,
                    .05
                );

            color: #67dc91;

            font:
                inherit;

            font-size: 13px;
            font-weight: 800;

            cursor: pointer;
        }

    </style>

</head>

<body>

<main>

    <div class="mark">

        <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
        >

            <rect
                x="4"
                y="5"
                width="16"
                height="15"
                rx="3"
            />

            <path
                d="M8 3v4M16 3v4M4 10h16"
            />

            <path
                d="M8 14h3M13 14h3M8 17h3"
            />

        </svg>

    </div>


    <span class="eyebrow">
        Agenda Personal
    </span>


    <h1>
        Sin conexión.
    </h1>


    <p>
        No hay acceso al servidor en este momento.
        Tus datos no se almacenan offline.
        Recuperá la conexión a Tailscale o a la red
        y volvé a intentarlo.
    </p>


    <button
        type="button"
        onclick="location.reload()"
    >
        Reintentar conexión
    </button>

</main>

</body>

</html>
